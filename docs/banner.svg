<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="t d">
  <title id="t">StockYard - open-source inventory management system</title>
  <desc id="d">Procure-to-stock inventory management with a four-bucket stock ledger, lot and serial traceability, purchase orders, goods receipts, approvals and replenishment.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b2140"/>
      <stop offset="0.55" stop-color="#1f4e79"/>
      <stop offset="1" stop-color="#1f6feb"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="360" rx="20" fill="url(#bg)"/>
  <g opacity="0.10" fill="#fff">
    <rect x="900" y="200" width="70" height="110" rx="6"/>
