<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="t d">
  <title id="t">StockYard procure-to-stock workflow and stock ledger architecture</title>
  <desc id="d">Purchase order, approval, send to supplier, gate entry, inspection and goods receipt feed a single posting service, which validates period, tracking, expiry, serial state and availability before writing an immutable ledger with four buckets: on hand, reserved, blocked and in transit.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#5b6b82"/>
    </marker>
  </defs>
  <rect width="1200" height="520" rx="18" fill="#ffffff"/>
  <g font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif">
    <text x="40" y="52" font-size="22" font-weight="700" fill="#0b2140">Procure-to-stock workflow</text>

    <!-- Stage boxes -->
    <g font-size="15" font-weight="600" text-anchor="middle">
      <rect x="40" y="80" width="150" height="70" rx="10" fill="#e8f0fe" stroke="#1f6feb"/>
      <text x="115" y="111" fill="#0b2140">Purchase order</text><text x="115" y="132" font-size="12" font-weight="400" fill="#4a5568">Procurement</text>
      <rect x="230" y="80" width="150" height="70" rx="10" fill="#fff7e6" stroke="#d48806"/>
      <text x="305" y="111" fill="#0b2140">Approval</text><text x="305" y="132" font-size="12" font-weight="400" fill="#4a5568">Approver queue</text>
      <rect x="420" y="80" width="150" height="70" rx="10" fill="#e8f0fe" stroke="#1f6feb"/>
      <text x="495" y="111" fill="#0b2140">Sent to supplier</text><text x="495" y="132" font-size="12" font-weight="400" fill="#4a5568">Procurement</text>
      <rect x="610" y="80" width="150" height="70" rx="10" fill="#e6fffb" stroke="#08979c"/>
      <text x="685" y="111" fill="#0b2140">Gate entry</text><text x="685" y="132" font-size="12" font-weight="400" fill="#4a5568">Storekeeper</text>
      <rect x="800" y="80" width="150" height="70" rx="10" fill="#e6fffb" stroke="#08979c"/>
      <text x="875" y="111" fill="#0b2140">Inspection</text><text x="875" y="132" font-size="12" font-weight="400" fill="#4a5568">Accepted / rejected</text>
      <rect x="990" y="80" width="170" height="70" rx="10" fill="#f6ffed" stroke="#389e0d"/>
      <text x="1075" y="111" fill="#0b2140">Goods receipt</text><text x="1075" y="132" font-size="12" font-weight="400" fill="#4a5568">Lot, expiry, serials</text>
    </g>
    <g stroke="#5b6b82" stroke-width="2" marker-end="url(#a)">
      <line x1="190" y1="115" x2="228" y2="115"/><line x1="380" y1="115" x2="418" y2="115"/>
      <line x1="570" y1="115" x2="608" y2="115"/><line x1="760" y1="115" x2="798" y2="115"/>
      <line x1="950" y1="115" x2="988" y2="115"/>
    </g>
    <line x1="1075" y1="150" x2="1075" y2="200" stroke="#5b6b82" stroke-width="2"/>
    <text x="875" y="176" font-size="12" text-anchor="middle" fill="#cf1322">Rejected qty never enters stock</text>

    <!-- Other sources -->
    <g font-size="13" text-anchor="middle" fill="#0b2140">
      <rect x="40" y="200" width="300" height="56" rx="10" fill="#f9f0ff" stroke="#722ed1"/>
      <text x="190" y="223" font-weight="600">Issues · Returns · Reservations</text>
      <text x="190" y="243" fill="#4a5568">Blocks · Scrap · Adjustments (approved)</text>
      <rect x="370" y="200" width="270" height="56" rx="10" fill="#fff2e8" stroke="#d4380d"/>
      <text x="505" y="223" font-weight="600">Transfers</text>
      <text x="505" y="243" fill="#4a5568">Direct or in transit (dispatch → receive)</text>
    </g>
    <g stroke="#5b6b82" stroke-width="2" marker-end="url(#a)" fill="none">
      <path d="M190 256 V288 H440"/>
      <path d="M505 256 V286"/>
      <path d="M1075 256 V288 H760"/>
    </g>
    <line x1="1075" y1="200" x2="1075" y2="256" stroke="#5b6b82" stroke-width="2"/>

    <!-- Posting service -->
    <rect x="300" y="292" width="600" height="96" rx="12" fill="#0b2140"/>
    <text x="600" y="324" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">Single posting service (atomic transaction)</text>
    <text x="600" y="350" font-size="13" fill="#cfe0ff" text-anchor="middle">Validates: open accounting period · tracking type · lot expiry · serial state</text>
    <text x="600" y="370" font-size="13" fill="#cfe0ff" text-anchor="middle">available quantity · permissions · idempotency key → writes ledger + audit trail</text>
    <line x1="600" y1="388" x2="600" y2="414" stroke="#5b6b82" stroke-width="2" marker-end="url(#a)"/>

    <!-- Buckets -->
    <g font-size="14" font-weight="700" text-anchor="middle" fill="#fff">
      <rect x="220" y="418" width="180" height="50" rx="10" fill="#1f6feb"/><text x="310" y="448">ON_HAND</text>
      <rect x="415" y="418" width="180" height="50" rx="10" fill="#7c3aed"/><text x="505" y="448">RESERVED</text>
      <rect x="610" y="418" width="180" height="50" rx="10" fill="#d97706"/><text x="700" y="448">BLOCKED</text>
      <rect x="805" y="418" width="180" height="50" rx="10" fill="#0d9488"/><text x="895" y="448">IN_TRANSIT</text>
    </g>
    <text x="600" y="496" font-size="14" text-anchor="middle" fill="#0b2140">Available = on hand − reserved − blocked (derived, never stored) · weighted average cost · reversals, never edits</text>
  </g>
</svg>
